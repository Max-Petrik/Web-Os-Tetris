<!DOCTYPE html>

<html lang="de">
<head>
	<meta charset="UTF-8">
	<title>Anmeldung Tetris</title>

					<input type="text" id="fvorname" placeholder="Vorname" required>

				<div class="input-box">
					<input type="text" id="femail" placeholder="Email" required>
				</div>
			</form>
			<a href="http://pan.th-brandenburg.de/~petrik/cgi-bin/game.cgi">
				<button type="submit" class="btn">Spielen</button>
			</a>
		</div>
		<div class="gitHub">
			<a href="https://github.com/Max-Petrik/Web-Os-Tetris">

	</div>
