<!DOCTYPE html>
<html lang="de">
<head>
	<meta charset="UTF-8">
	<title>Web/OS-Tetris</title>
	<link rel="preconnect" href="https://font.googleapis.com">
	<link rel="preconnect" href="https://gstatic.com" crossorigin>
	<link rel="stylesheet" href="font.gooleapis.com/css2?family=Aktwght@100..900display=swap">
	<link rel="stylesheet" href="css/game_style.css" type="text/css">
</head>
<body>
	<div class="scoreboard">
		
	</div>
	<div class="gameField">
		<canvas id="gameCanvas" width="600" height="1100"></canvas>	
	</div>
	<div class="infoBlock">
		<div class="punkteBlock">
			<h1>Score: </h1>
			<h2>0 Punkte</h2>
			<h1>Level:</h1>
			<h2>1</h2>		
		</div>
		<div class="textNextBlock">
			<h1>Nächster Block:</h1>
		</div>
		<div class="imgNextBlock">
			
		</div>
	</div>

<script>

	let tickRate = 1; // ms (1/tickRate ist de Frequenz in denen die Blöcke fallen)
	let fld = []; // Felder Besetzung
	for(let i = 0; i < 22; i++){
		fld[i] = [];
		for(let j = 0; j < 12; j++){
			fld[i][j] = [];
			fld[i][j][0] = false;		// Index [i][j][0] sagt ob das Feld belegt ist (0 nein / 1 ja); Index [i][j][1] gibt den Farbcode
			fld[i][j][1] = "0";
			if(i == 21){
				fld[i][j][0] = true;
			}		
		}
	}	

	const canvas = document.getElementById("gameCanvas");
	const draw = canvas.getContext("2d");
	
	class iBlock{		
		constructor(color){
			this.color = color;
			this.pos = [[200,150],[250,150],[300,150],[350,150]];		
		}
	}
	class z1Block{		
		constructor(color){
			this.color = color;
			this.pos = [[300,150],[250,150],[300,100],[350,100]];		
		}
	}
	class z2Block{		
		constructor(color){
			this.color = color;
			this.pos = [[300,150],[250,100],[300,100],[350,150]];		
		}
	}
	class l1Block{		
		constructor(color){
			this.color = color;
			this.pos = [[300,150],[250,150],[250,100],[350,150]];		
		}
	}
	class l2Block{		
		constructor(color){
			this.color = color;
			this.pos = [[300,150],[250,150],[350,100],[350,150]];		
		}
	}
	class oBlock{		
		constructor(color){
			this.color = color;
			this.pos = [[250,150],[300,150],[300,100],[250,100]];		
		}
	}
	class tBlock{		
		constructor(color){
			this.color = color;
			this.pos = [[300,150],[250,150],[300,100],[350,150]];		
		}
	}
	let block = new z2Block("green");
	
	for(let i = 0; i < 22; i++){
		for(let j = 0; j < 12; j++){
			if(i == 0 || i == 21 || j == 0 || j == 11){
				draw.fillStyle = "#404040";
				draw.fillRect(0+j*50, 0+i*50, 50, 50);
				draw.fillStyle = "gray";
				draw.fillRect(7+j*50, 7+i*50, 36, 36);
				drawFld();
			}
		}	
	}

	document.addEventListener("keydown", handleInput);
	function handleInput(e){
		if(e.key == "w" || e.key == "ArrowUp" || e.key == " "){
			
		}else if(e.key == "a" || e.key == "ArrowLeft"){
			for(let i = 0; i < 4; i++){
				block.pos[i][0] -= 50;	
			}
		}else if(e.key == "d" || e.key == "ArrowRight"){
			for(let i = 0; i < 4; i++){
				block.pos[i][0] += 50;
			}
		}else if(e.key == "s" || e.key == "ArrowDown"){
			for(let i = 0; i < 4; i++){
				block.pos[i][1] += 6;
			}
		}
	}

	function move(){
		for(let i = 0; i < 4; i++){
			if(!collision(Math.floor(block.pos[i][1]/50), Math.floor(block.pos[i][0]/50))){
				block.pos[i][1] += 1; // Faktor x zur Frequenz (x/tickRate) ist die tatsächliche Frequenz)
			}else{break;}
		}
		drawFld();
	}
	function drawFld(){
		draw.fillStyle = "#000033";
		draw.fillRect(50, 50, 500, 1000);
		draw.fillStyle = block.color;
		
		for(let i = 0; i < 4; i++){
			draw.fillRect(0+block.pos[i][0], 0+block.pos[i][1], 50, 50);
		}
		for(let i = 0; i < 22; i++){
			for(let j = 0; j < 12; j++){
				if(fld[i][j][0] == true && fld[i][j][1] != false){
					draw.fillStyle = fld[i][j][1];
					draw.fillRect(0+j*50, 0+i*50, 50, 50);
				}
			}
		}
	}

	function collision(x, y){
		if(fld[x+1][y][0] == true){
			for(let i = 0; i < 4; i++){
				fld[Math.floor(block.pos[i][1]/50)][Math.floor(block.pos[i][0]/50)][0] = true;
				fld[Math.floor(block.pos[i][1]/50)][Math.floor(block.pos[i][0]/50)][1] = block.color;
			}
			block = null;
			let randomColor = Math.floor(Math.random()*7)+1;
			let randomBlock = Math.floor(Math.random()*7)+1;
			let color = null;
			switch(randomColor){
				case 1: 
					color = "#ff0000";
					break;
				case 2: 
					color = "#ff7700";
					break;
				case 3: 
					color = "#1900ff";
					break;
				case 4: 
					color = "#00d5ff";
					break;
				case 5: 
					color = "#15ff00";
					break;
				case 6: 
					color = "fff700";
					break;
				case 7: 
					color = "#a600ff";
					break;
			}
			switch(randomBlock){
				case 1: 
					block = new iBlock(color);
					break;
				case 2: 
					block = new oBlock(color);
					break;
				case 3: 
					block = new z1Block(color);
					break;
				case 4: 
					block = new z1Block(color);
					break;
				case 5: 
					block = new l1Block(color);
					break;
				case 6: 
					block = new l2Block(color);
					break;
				case 7: 
					block = new tBlock(color);
					break;
			}
			return true;
		}
	}
	
 	let intervalID;
	function clock(){
		intervalId = setInterval(() => {move();}, tickRate);
	}
	clock();
	
</script>

</body>
</html>
